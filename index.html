<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingenting</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .line1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: #c8c0b0;
      letter-spacing: 0.18em;
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeIn 4s ease forwards;
      animation-delay: 0.8s;
    }

    .divider {
      width: 1px;
      height: 3rem;
      background: linear-gradient(to bottom, transparent, #555, transparent);
      margin: 0 auto 2.2rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 2.8s;
    }

    .line2 {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: #888070;
      letter-spacing: 0.18em;
      font-style: italic;
      opacity: 0;
      animation: fadeIn 4s ease forwards;
      animation-delay: 4.8s;
    }

    .glow {
      position: fixed;
      width: 40vw; height: 40vw;
      max-width: 500px; max-height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80,70,60,0.18) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: breathe 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    @keyframes breathe {
  0%, 100% { transform: translate(-50%,-50%) scale(1);    opacity: 0.4; }
  50%       { transform: translate(-50%,-50%) scale(1.4);  opacity: 1;   }
}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <p class="line1">Bak denne siden er ingenting.</p>
    <div class="divider"></div>
    <p class="line2">…og likevel er det nok.</p>
  </div>
</body>
</html>
