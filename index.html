html {
  background: #080706;
  height: 100%;
}

body {
  /* Warm dark centre fading to near-black — pure CSS radial, no SVG filters */
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%,
      #131110 0%,
      #0a0908 45%,
      #040303 100%);
  color: #cfc8bc;
  font-family: 'IM Fell English', Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* Vignette: dark edges, transparent centre */
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center,
    transparent 30%,
    rgba(0, 0, 0, 0.45) 70%,
    rgba(0, 0, 0, 0.78) 100%);
  pointer-events: none;
  z-index: 3;
}

.scene {
  position: relative;
  text-align: center;
  padding: 4rem 2.5rem;
  max-width: 600px;
  width: 100%;
  margin-bottom: 6vh;
  z-index: 10;
}

.line {
  display: block;
  opacity: 0;
  transform: translateY(7px);
}

.line-1 {
  font-size: clamp(1.25rem, 4vw, 1.85rem);
  font-style: normal;
  letter-spacing: 0.01em;
  line-height: 1.55;
  color: #cfc8bc;
  animation: emerge 2.4s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
}

.divider {
  display: block;
  width: 1px;
  height: 2.8em;
  margin: 0.6em auto;
  opacity: 0;
  animation: fadein 1.2s ease 3.6s forwards;
  background: linear-gradient(to bottom, transparent, #4a443c, transparent);
}

.line-2 {
  font-size: clamp(1rem, 3.2vw, 1.5rem);
  font-style: italic;
  letter-spacing: 0.02em;
  line-height: 1.55;
  color: #6e665c;
  animation: emerge 3s cubic-bezier(0.16, 1, 0.3, 1) 4.0s forwards;
}

@keyframes emerge {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0);   }
}

@keyframes fadein {
  from { opacity: 0; }
  to   { opacity: 1; }
}

  <div class="vignette"></div>

  <main class="scene">
    <span class="line line-1">Bak denne siden er ingenting.</span>
    <div class="divider" aria-hidden="true"></div>
    <span class="line line-2">…og likevel er det nok.</span>
  </main>

  <script>
    // Draw grain into a 256×256 canvas tile, export as data URL,
    // then tile it as a CSS background — works reliably on iOS Safari
    (function () {
      const c   = document.createElement('canvas');
      c.width   = 256;
      c.height  = 256;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(256, 256);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255 | 0;
        img.data[i]     = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v;
        img.data[i + 3] = 20; // faint alpha
      }
      ctx.putImageData(img, 0, 0);

      const div = document.createElement('div');
      div.style.cssText =
        'position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0.4;' +
        'background-image:url(' + c.toDataURL() + ');' +
        'background-repeat:repeat;background-size:256px 256px;';
      document.body.appendChild(div);
    })();
  </script>

</body>
