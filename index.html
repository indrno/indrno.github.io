:root {
  --bg: #090909;
  --text: #d8d0c4;
  --text-dim: #6a6258;
  --glow: rgba(210, 195, 175, 0.04);
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'IM Fell English', Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  cursor: none;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
  pointer-events: none;
  z-index: 10;
  opacity: 0.6;
}

/* Vignette */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
  z-index: 9;
}

/* Custom cursor */
.cursor {
  position: fixed;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(216, 208, 196, 0.35);
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%);
  transition: opacity 0.4s ease;
  box-shadow: 0 0 12px 4px rgba(216, 208, 196, 0.08);
}

.scene {
  position: relative;
  text-align: center;
  padding: 4rem 2rem;
  max-width: 640px;
  /* Slightly above center — golden ratio feel */
  margin-bottom: 8vh;
  z-index: 20;
}

.line {
  display: block;
  opacity: 0;
  transform: translateY(6px);
}

.line-1 {
  font-size: clamp(1.3rem, 3.5vw, 2rem);
  font-style: normal;
  letter-spacing: 0.01em;
  line-height: 1.5;
  color: var(--text);
  animation: emerge 2.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
}

.line-2 {
  font-size: clamp(1.05rem, 2.8vw, 1.6rem);
  font-style: italic;
  letter-spacing: 0.015em;
  line-height: 1.5;
  color: var(--text-dim);
  margin-top: 1.8em;
  animation: emerge 2.8s cubic-bezier(0.16, 1, 0.3, 1) 4.2s forwards;
}

/* Separator breath */
.pause {
  display: block;
  width: 1px;
  height: 3.5em;
  margin: 0 auto;
  opacity: 0;
  animation: pulse-line 2s ease 3.8s forwards;
  position: relative;
}

.pause::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 1px;
  height: 100%;
  background: linear-gradient(to bottom, transparent, var(--text-dim), transparent);
  opacity: 0.3;
}

@keyframes emerge {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse-line {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Breathing ambient light behind text */
.ambient {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 200px;
  background: radial-gradient(ellipse, rgba(200, 185, 160, 0.03) 0%, transparent 70%);
  pointer-events: none;
  animation: breathe 8s ease-in-out infinite;
  z-index: -1;
}

@keyframes breathe {
  0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}

<body>

  <div class="cursor" id="cursor"></div>

  <main class="scene" role="main">
    <div class="ambient"></div>
    <span class="line line-1">Bak denne siden er ingenting.</span>
    <span class="pause" aria-hidden="true"></span>
    <span class="line line-2">…og likevel er det nok.</span>
  </main>

  <script>
    // Cursor follow
    const cursor = document.getElementById('cursor');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let cx = mx, cy = my;

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    (function animate() {
      cx += (mx - cx) * 0.08;
      cy += (my - cy) * 0.08;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      requestAnimationFrame(animate);
    })();

    // Hide cursor when idle
    let idleTimer;
    document.addEventListener('mousemove', () => {
      cursor.style.opacity = '1';
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        cursor.style.opacity = '0';
      }, 3000);
    });
  </script>

</body>
