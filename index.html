html {
  background: #080706;
  height: 100%;
}

body {
  /* Warm dark centre fading to near-black — pure CSS radial, no SVG filters */
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%,
      #131110 0%,
      #0a0908 45%,
      #040303 100%);
  color: #cfc8bc;
  font-family: 'IM Fell English', Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* Vignette: dark edges, transparent centre */
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center,
    transparent 30%,
    rgba(0, 0, 0, 0.45) 70%,
    rgba(0, 0, 0, 0.78) 100%);
  pointer-events: none;
  z-index: 3;
}

.scene {
  position: relative;
  text-align: center;
  padding: 4rem 2.5rem;
  max-width: 600px;
  width: 100%;
  margin-bottom: 6vh;
  z-index: 10;
}

.line {
  display: block;
  opacity: 0;
  transform: translateY(7px);
}

.line-1 {
  font-size: clamp(1.25rem, 4vw, 1.85rem);
  font-style: normal;
  letter-spacing: 0.01em;
  line-height: 1.55;
  color: #cfc8bc;
  animation: emerge 2.4s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
}

.divider {
  display: block;
  height: 3em;
  opacity: 0;
  animation: fadein 1.2s ease 3.6s forwards;
  position: relative;
}

.divider::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 1px;
  height: 2em;
  background: linear-gradient(to bottom, transparent, #4a443c, transparent);
}

.line-2 {
  font-size: clamp(1rem, 3.2vw, 1.5rem);
  font-style: italic;
  letter-spacing: 0.02em;
  line-height: 1.55;
  color: #6e665c;
  animation: emerge 3s cubic-bezier(0.16, 1, 0.3, 1) 4.0s forwards;
}

@keyframes emerge {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0);   }
}

@keyframes fadein {
  from { opacity: 0; }
  to   { opacity: 1; }
}

<body>

  <div class="cursor" id="cursor"></div>

  <main class="scene" role="main">
    <div class="ambient"></div>
    <span class="line line-1">Bak denne siden er ingenting.</span>
    <span class="pause" aria-hidden="true"></span>
    <span class="line line-2">…og likevel er det nok.</span>
  </main>

  <script>
    // Cursor follow
    const cursor = document.getElementById('cursor');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let cx = mx, cy = my;

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    (function animate() {
      cx += (mx - cx) * 0.08;
      cy += (my - cy) * 0.08;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      requestAnimationFrame(animate);
    })();

    // Hide cursor when idle
    let idleTimer;
    document.addEventListener('mousemove', () => {
      cursor.style.opacity = '1';
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        cursor.style.opacity = '0';
      }, 3000);
    });
  </script>

</body>
