:root {
  --bg: #0a0a0b;
  --text: #c8c2b8;
  --dim: #4a4540;
  --accent: #8a7f74;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background-color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  overflow: hidden;
}

/* Subtle grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 10;
  opacity: 0.4;
}

/* Faint radial glow at center */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(100,90,80,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 2rem;
  opacity: 0;
  animation: appear 3.5s ease forwards;
  animation-delay: 0.4s;
}

/* Thin horizontal rule above */
.rule {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, transparent, var(--dim));
  margin: 0 auto 2.8rem;
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 1.2s;
}

.rule-bottom {
  background: linear-gradient(to bottom, var(--dim), transparent);
  margin: 2.8rem auto 0;
  animation-delay: 1.6s;
}

.main-text {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
  color: var(--text);
  line-height: 1.85;
  letter-spacing: 0.03em;
  font-style: italic;
}

.main-text .line-two {
  display: block;
  margin-top: 0.6em;
  color: var(--accent);
  font-size: 0.88em;
  letter-spacing: 0.08em;
}

.ellipsis {
  color: var(--dim);
  font-style: normal;
  letter-spacing: 0.12em;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Tiny cursor dot */
.cursor {
  display: inline-block;
  width: 3px;
  height: 3px;
  background: var(--dim);
  border-radius: 50%;
  vertical-align: middle;
  margin-left: 0.3em;
  animation: blink 3.2s ease-in-out infinite;
  animation-delay: 4s;
  opacity: 0;
}

@keyframes blink {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}
