<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ingenting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #090909;
      height: 100%;
    }

    body {
      background: #090909;
      color: #cfc8bc;
      font-family: 'IM Fell English', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Subtle vignette — dark edges only, no center brightness */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, 0.55) 80%,
        rgba(0, 0, 0, 0.85) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .scene {
      position: relative;
      text-align: center;
      padding: 4rem 2.5rem;
      max-width: 600px;
      width: 100%;
      margin-bottom: 6vh;
      z-index: 3;
    }

    .line {
      display: block;
      opacity: 0;
      transform: translateY(7px);
    }

    .line-1 {
      font-size: clamp(1.25rem, 4vw, 1.85rem);
      font-style: normal;
      letter-spacing: 0.01em;
      line-height: 1.55;
      color: #cfc8bc;
      animation: emerge 2.4s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }

    .divider {
      display: block;
      height: 3em;
      opacity: 0;
      animation: fadein 1.2s ease 3.6s forwards;
      position: relative;
    }

    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1px;
      height: 2em;
      background: linear-gradient(to bottom, transparent, #5a5348, transparent);
    }

    .line-2 {
      font-size: clamp(1rem, 3.2vw, 1.5rem);
      font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1.55;
      color: #6e665c;
      animation: emerge 3s cubic-bezier(0.16, 1, 0.3, 1) 4.0s forwards;
    }

    @keyframes emerge {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="vignette"></div>

  <main class="scene">
    <span class="line line-1">Bak denne siden er ingenting.</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="line line-2">…og likevel er det nok.</span>
  </main>

</body>
</html>
